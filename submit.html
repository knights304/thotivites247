<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Submit Challenge | Thotivites247</title>
  <meta name="description" content="Generate a #thotivities challenge prompt for X or the app review queue." />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">🎰</span>
      <span>Thotivites247</span>
    </a>

    <nav>
      <a href="spin.html">Spin</a>
      <a href="submit.html">Submit</a>
    </nav>
  </header>

  <main class="page">
    <section class="result-card">
      <div class="badge">X PROMPT GENERATOR</div>
      <h1>Submit</h1>
      <p class="tagline">Make a clean #thotivities post</p>

      <div class="form-box">
        <label for="creatorName">Creator name or handle</label>
        <input id="creatorName" type="text" maxlength="32" placeholder="@YourHandle or your name" />
      </div>

      <div class="form-box">
        <label for="challengeText">Challenge idea</label>
        <textarea id="challengeText" rows="6" placeholder="Example: Create a 15 second dance challenge"></textarea>
      </div>

      <div class="form-box">
        <label for="categorySelect">Category</label>
        <select id="categorySelect">
          <option>VIDEO CHALLENGE</option>
          <option>THOT ADVENTURE</option>
          <option>CERTIFIED THOTIVITY</option>
          <option>DANCE CHALLENGE</option>
          <option>GENERAL THOTIVITIES</option>
        </select>
      </div>

      <div class="form-box">
        <label for="symbolSelect">Mystery Symbol</label>
        <select id="symbolSelect">
          <option>❓</option>
          <option>🔥</option>
          <option>🎲</option>
          <option>💋</option>
          <option>😈</option>
          <option>🎭</option>
          <option>👑</option>
          <option>⚡</option>
          <option>📸</option>
        </select>
      </div>

      <div class="actions">
        <button onclick="generatePrompt()">Generate X Prompt</button>
        <button onclick="copyPrompt()">Copy Prompt</button>
        <button onclick="sharePrompt()">Share Prompt</button>
      </div>

      <div class="share-card hidden" id="promptCard">
        <p id="promptOutput"></p>
      </div>

      <p class="footer">
        Post this on X from @Thotivites247, or paste it into the app Community Queue for review.
      </p>
    </section>
  </main>

  <script src="site.js"></script>
</body>
</html>
